[package]
name = "axum-tokio"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22.0"
http = "1.1.0"
hyper = { version = "1", features = ["full"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
