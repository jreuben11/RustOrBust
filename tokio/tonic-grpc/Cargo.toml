[package]
name = "tonic-grpc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "routeguide-server"
path = "src/server.rs"

[[bin]]
name = "routeguide-client"
path = "src/client.rs"


[dependencies]
async-stream = "0.3"
prost = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.13"

[build-dependencies]
tonic-build = "0.13"

[workspace]
